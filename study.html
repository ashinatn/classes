<script>
const K='studyflow.v1',CFG={weights:{gap:.30,marks:.12,urgency:.22,syllabus:.14,difficulty:.10,confidence:.08,trend:.04},slot:50,brk:10,minSlot:30,lunch:[780,810],dinner:[1200,1230],maxPerDay:2,minShare:.08,horizon:7};
const COL=['#5b5bf0','#e11d48','#059669','#d97706','#0891b2','#9333ea','#65a30d','#db2777'];

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||sample();if(!S.seenHome){S.view='home';S.seenHome=1}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(window.SF_SERVER){clearTimeout(save.t);save.t=setTimeout(()=>fetch('/api/state',{method:'PUT',headers:{'X-StudyFlow':'1','Content-Type':'application/json'},body:JSON.stringify(S)}).catch(()=>{}),300)}};

function split(m,kind){const r=kind=='Revision'?[['Recall key points from memory',.25],['Past-paper / practice questions',.4],['Correct mistakes',.2],['Recall formulas & definitions',.15]]:kind=='Learn'?[['Review the concept',.35],['Solve practice problems',.4],['Correct mistakes',.15],['Recall formulas & key points',.1]]:[['Quick concept refresh',.2],['Practice questions',.5],['Correct mistakes',.2],['Recall key points',.1]];let left=m;return r.map((x,i)=>{const a=i==r.length-1?left:Math.min(Math.max(5,Math.round(m*x[1]/5)*5),left-5*(r.length-1-i));left-=a;return{m:a,t:x[0]}})}
function generate(){const P=S.profile,sub=S.subjects,warns=[],pr=sub.map(prio),sum=pr.reduce((a,x)=>a+x.v,0)||1;
const days=[];let cap=0;
for(let i=0;i<CFG.horizon;i++){const d=addD(i),wake=tm(P.wake),sl=tm(P.sleep),end=sl>wake?sl:1439,start=wake+30,items=[],busy=[];
const add=(s,e,t)=>{busy.push({s,e});items.push({s,e,t,k:'life'})};add(wake,start,'Wake up & get ready');
if(d.getDay()>0&&d.getDay()<6){const cs=tm(P.cs),ce=tm(P.ce),tr=+P.travel;add(cs-tr,cs,'Travel to college');add(cs,ce,'College');add(ce,ce+tr,'Travel home');add(ce+tr,ce+tr+30,'Rest & snack')}
add(CFG.lunch[0],CFG.lunch[1],'Lunch');add(CFG.dinner[0],CFG.dinner[1],'Dinner');
const slots=[],lim=P.hours*60;let used=0;
for(const[a,b]of free(start,end,busy)){let t=a;while(b-t>=CFG.minSlot&&used<lim){const m=Math.min(CFG.slot,b-t,lim-used);if(m<CFG.minSlot)break;slots.push([t,t+m]);used+=m;t+=m;if(b-t>=CFG.minSlot+CFG.brk&&used<lim){items.push({s:t,e:t+CFG.brk,t:'Break',k:'break'});t+=CFG.brk}}}
cap+=used;days.push({d,i,items,slots,busy,end})}
let sh=pr.map(x=>Math.max(x.v/sum,CFG.minShare));const ss=sh.reduce((a,b)=>a+b,0),rem=sh.map(x=>x/ss*cap),cnt=sub.map(()=>0),sessions=[];
const L=Object.values(S.log||{}),done=L.filter(x=>x.st=='done'),miss=L.filter(x=>x.st=='missed'&&!x.rp&&x.topic&&!done.some(y=>y.sid==x.sid&&y.topic==x.topic));
sub.forEach((s,i)=>{const n=s.topics.length,tw=s.tw||{};let r=s.mods?s.topics.filter(t=>!(s.done||[]).includes(t)):s.topics.slice(Math.round(n*s.syll/100));r.sort((a,b)=>(tw[b]??-1)-(tw[a]??-1));
const ms=miss.filter(x=>x.sid==s.id).map(x=>x.topic).filter((t,j,a)=>a.indexOf(t)==j);r=[...ms,...r.filter(t=>!ms.includes(t))];
const ws=r.map(t=>tw[t]).filter(v=>v>0),av=ws.length?ws.reduce((a,b)=>a+b,0)/ws.length:0,cp=t=>av&&tw[t]>0?clamp(Math.round(tw[t]/av),1,3):1,o=[];for(let k=0;k<3;k++)r.forEach(t=>{if(cp(t)>k)o.push(t)});s._top=o;s._av=av});
miss.forEach(x=>{const i=sub.findIndex(s=>s.id==x.sid);if(i>=0)rem[i]+=x.m});
const el=(sid,di)=>{const d=dLeft(sub.find(z=>z.id==sid));return d==null||d-di>0},rvDone=new Set(done.filter(x=>x.rv).map(x=>x.sid+'|'+x.topic+'|'+x.rv)),rq=[];
done.filter(x=>!x.rv&&x.topic).forEach(x=>[1,3,7,14].forEach(iv=>{const k=x.sid+'|'+x.topic+'|'+iv;if(rvDone.has(k)||rq.some(y=>y.k==k)||!sub.some(z=>z.id==x.sid))return;const idx=Math.round((new Date(x.date+'T00:00')-today())/864e5)+iv;if(idx<=6)rq.push({k,sid:x.sid,topic:x.topic,iv,day:Math.max(0,idx)})}));
for(const D of days){const dc={};let last=-1,rvS=0;
for(const[a,b]of D.slots){const due=rq.filter(y=>y.day<=D.i&&!y.u&&el(y.sid,D.i));
if(due.length&&rvS<Math.ceil(D.slots.length/2)){const take=due.slice(0,2),per=Math.floor((b-a)/take.length);take.forEach((y,j)=>{y.u=1;const s=sub.find(z=>z.id==y.sid),i=sub.indexOf(s),s0=a+j*per,e0=j==take.length-1?b:s0+per,m=e0-s0,m1=Math.round(m*.6);rem[i]-=m;const it={s:s0,e:e0,k:'study',sid:s.id,i,name:s.name,topic:y.topic,kind:'Spaced review',rv:y.iv,m,pri:'Medium',tasks:[{m:m1,t:`Recall "${y.topic}" from memory without notes`},{m:m-m1,t:'Check notes and fix gaps'}]};D.items.push(it);sessions.push({day:D.i,date:iso(D.d),...it})});rvS++;last=-1;continue}

const hw=topic&&s._av&&(s.tw||{})[topic]>=s._av*1.3?1:0,p=pr[i].v/(sum/sub.length);const it={s:a,e:b,k:'study',sid:s.id,i,name:s.name,topic,kind,m,pri:hw||p>1.15?'High':p>.85?'Medium':'Low',hw,mod:topic&&s.mods?(s.mods.find(m=>m.topics.some(y=>y.t==topic))||{}).name:null,w:topic?(s.tw||{})[topic]:null,tasks:split(m,kind)};D.items.push(it);sessions.push({day:D.i,date:iso(D.d),...it})}

D.items.sort((x,y)=>x.s-y.s)}

const rgc=(p,l,sub,c)=>`<div><div class="rg" style="--p:${clamp(p,0,100)};--c:${c}"><span>${l}</span></div><div class="mu">${sub}</div></div>`;
function genGo(){if(!S.subjects.length){toast('Add at least one subject first.');return go('marks')}gen();go('tt')}
function quick(i){const D=((S.tt||{}).days||[]).find(x=>x.date==iso(today())),x=D&&D.items.filter(k=>k.k=='study')[i];if(!x)return;S.timer={...tcfg(),sid:x.sid,topic:x.topic||''};save();go('timer')}
function vHome(){const P=S.profile,L=Object.values(S.log||{}).filter(x=>x.st=='done'),xp=L.reduce((a,x)=>a+x.m,0),lv=Math.floor(Math.sqrt(xp/20))+1,lo=20*(lv-1)**2,hi=20*lv*lv,{cur,best}=streaks(),td=iso(today()),byD={};
L.forEach(x=>byD[x.date]=(byD[x.date]||0)+x.m);
const dd=byD[td]||0,D=((S.tt||{}).days||[]).find(x=>x.date==td),pl=D?D.items.filter(x=>x.k=='study'):[],plan=pl.reduce((a,x)=>a+x.m,0),wk=Array.from({length:7},(_,i)=>byD[iso(addD(-i))]||0).reduce((a,b)=>a+b,0),cap=S.tt?S.tt.cap:0,
sa=S.subjects.length?Math.round(S.subjects.reduce((a,x)=>a+x.syll,0)/S.subjects.length):0,hr=new Date().getHours(),gr=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening',
ex=S.subjects.map(x=>({x,d:dLeft(x)})).filter(x=>x.d!=null&&x.d>=0).sort((a,b)=>a.d-b.d).slice(0,4),off=new Date().getDay()+105,
hm=Array.from({length:112},(_,i)=>{const d=addD(i-off),m=byD[iso(d)]||0,l=d>today()?0:m==0?0:m<30?1:m<60?2:m<120?3:4;return`<i style="--l:${l}" class="${d>today()?'fu':''}" title="${iso(d)}: ${m} min"></i>`}).join(''),
bd=[['🌱','First session',xp>0],['🔥','3-day streak',best>=3],['⚡','7-day streak',best>=7],['⏱️','5 hours studied',xp>=300],['🏆','20 hours studied',xp>=1200],['📝','Note taker',(S.notes||[]).length>0],['🎯','Target reached',S.subjects.some(x=>pct(x)>=tpct(x))],['📚','Syllabus 50%',sa>=50]];
return`<div class="hero"><div><div style="opacity:.85">${new Date().toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${gr}${P.name?', '+esc(P.name.split(' ')[0]):''} 👋</h1><p>💡 ${TIPS[new Date().getDay()]}</p><div style="max-width:340px"><b>Level ${lv}</b> <small>· ${xp} min studied · ${hi-xp} min to Level ${lv+1}</small><div class="bar"><i style="width:${(xp-lo)/(hi-lo)*100}%"></i></div></div><p></p><button class="w" onclick="genGo()">✨ Generate timetable</button><button class="w" onclick="go('timer')">⏱ Start focus</button><button class="w" onclick="toggleTheme()">🌓 Theme</button></div><div style="text-align:center"><div class="fl">🔥 ${cur}</div><small>day streak · best ${best}</small></div></div>
<div class="card"><div class="rings">${rgc(plan?dd/plan*100:dd>0?100:0,Math.round(plan?Math.min(100,dd/plan*100):dd>0?100:0)+'%',`Today: ${dd}/${plan} min`,'var(--pr)')}${rgc(cap?wk/cap*100:0,Math.round(cap?Math.min(100,wk/cap*100):0)+'%',`Week: ${(wk/60).toFixed(1)}/${(cap/60).toFixed(0)} h`,'#ec4899')}${rgc(sa,sa+'%','Syllabus done','#10b981')}</div></div>
${ex.length?`<div class="card"><h3>⏳ Exam countdown</h3>${ex.map(e=>`<span class="pill ${e.d<=7?'u':''}"><b>${esc(e.x.name)}</b> · ${e.d==0?'today':e.d+' day'+(e.d>1?'s':'')}</span>`).join('')}</div>`:''}
<div class="g2"><div class="card"><h3>📅 Today's plan</h3>${pl.length?pl.map((x,i)=>{const k=td+'|'+x.s+'|'+x.sid,st=(S.log||{})[k];return`<div class="pl" style="border-color:${COL[x.i%8]}"><div class="x"><b>${esc(x.name)}</b> <span class="tg">${x.kind}</span><div class="mu">${fm(x.s)}–${fm(x.e)}${x.topic?' · '+esc(x.topic):''}</div></div><button class="s" onclick="quick(${i})">▶</button><button class="s" onclick="mark('${td}',${x.s},'${x.sid}',${x.m})">${st?st.st=='done'?'✓':'✗':'○'}</button></div>`}).join(''):S.subjects.length?'<p class="mu">'+(S.tt&&S.tt.days[0].date<td?'Your timetable has expired.':'No plan for today yet.')+'</p><button class="b" onclick="genGo()">Generate my timetable</button>':'<p class="mu">Add your subjects and marks to begin.</p><button class="b" onclick="go(\'marks\')">Add subjects</button>'}</div>
<div class="card"><h3>🫧 Mastery map</h3><p class="mu">Bubble size = preparation priority. Number = latest mark.</p>${S.subjects.map((x,i)=>{const z=54+prio(x).v*90;return`<div class="bub"><b style="width:${z}px;height:${z}px;background:${COL[i%8]}">${pct(x).toFixed(0)}%</b>${esc(x.name)}</div>`}).join('')||'<span class="mu">No subjects yet.</span>'}</div></div>
<div class="card"><h3>🟩 Study heatmap (16 weeks)</h3><div class="hm">${hm}</div></div>
<div class="card"><h3>🏅 Achievements</h3>${bd.map(b=>`<span class="bdg ${b[2]?'ok2':'lk'}">${b[0]} ${b[1]}</span>`).join('')}</div>`}
function gen(){if(!S.subjects.length)return toast('Add at least one subject first.');S.pending=generate();if(!S.tt){S.tt=S.pending;S.pending=null}save();render()}
render();
if(window.SF_SERVER)fetch('/api/state',{headers:{'X-StudyFlow':'1'}}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.profile){S=d;if(S.theme)document.documentElement.dataset.theme=S.theme;render()}}).catch(()=>{});
</script></body></html>
